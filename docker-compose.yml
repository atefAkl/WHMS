services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wms-app
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
      - ./.env.docker:/app/.env
      - ./storage:/app/storage
      - ./bootstrap:/app/bootstrap
    ports:
      - "8080:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=laravel_wms
      - DB_USERNAME=wms_user
      - DB_PASSWORD=wms_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_STORE=redis
      - SESSION_DRIVER=database
      - QUEUE_CONNECTION=database
    depends_on:
      - postgres
      - redis
    networks:
      - wms-network

  postgres:
    image: postgres:15-alpine
    container_name: wms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: laravel_wms
      POSTGRES_USER: wms_user
      POSTGRES_PASSWORD: wms_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wms-network

  redis:
    image: redis:7-alpine
    container_name: wms-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - wms-network

volumes:
  postgres_data:
  redis_data:

networks:
  wms-network:
    driver: bridge
